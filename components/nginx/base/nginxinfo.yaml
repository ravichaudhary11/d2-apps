apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: nginxinfo-manifest
spec:
  interval: 5m
  url: oci://ghcr.io/ravichaudhary11/fluxxd2-test/nginx
  ref:
    tag: latest
---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: nginx-chart
spec:
  interval: 5m
  url: oci://ghcr.io/ravichaudhary11/charts/nginx
  ref:
    tag: 0.1.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
spec:
  releaseName: nginx
  chartRef:
    kind: OCIRepository
    name: nginx-chart
  interval: 5m
  driftDetection:
    mode: enabled
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
